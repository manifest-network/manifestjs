name: Dependency packages

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [lcd, manifestjs]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - name: Install the pinned package managers
        run: npm install --global npm@11.19.1 yarn@1.22.22 --ignore-scripts
      - name: Check publication guard negative controls
        run: node --test scripts/release.test.mjs
      - name: Build, test, and pack the selected package
        env:
          PACKAGE: ${{ matrix.package }}
          npm_config_registry: https://registry.npmjs.org
          npm_config_cache: ${{ runner.temp }}/npm-cache
        run: node scripts/build-release.mjs "$PACKAGE" "$RUNNER_TEMP/release"
