name: Release

on:
  workflow_dispatch:
    inputs:
      package:
        description: Reviewed package to publish
        type: choice
        options: [lcd, manifestjs]
        required: true
      version:
        description: Exact version already committed on main
        type: string
        required: true
      sha:
        description: Full reviewed main commit SHA (must match the dispatch SHA)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: npm-release-${{ inputs.package }}
  cancel-in-progress: false

env:
  RELEASE_TARGET: ${{ inputs.package }}
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_SHA: ${{ inputs.sha }}
  npm_config_registry: https://registry.npmjs.org

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - name: Isolate npm configuration
        run: printf 'npm_config_userconfig=%s/no-token-npmrc\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Require the reviewed main commit and package version
        run: node scripts/release.mjs guard
      - name: Install the pinned package managers
        run: npm install --global npm@11.19.1 yarn@1.22.22 --ignore-scripts
      - name: Test publication guards
        run: node --test scripts/release.test.mjs
      - name: Build and validate the exact release artifact
        run: |
          node scripts/build-release.mjs "$RELEASE_TARGET" "$RUNNER_TEMP/release"
          node scripts/release.mjs validate "$RELEASE_TARGET" "$RUNNER_TEMP/release" "$RELEASE_VERSION" "$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - name: Isolate npm configuration
        run: printf 'npm_config_userconfig=%s/no-token-npmrc\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install the pinned npm CLI
        run: npm install --global npm@11.19.1 --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-release
          path: ${{ runner.temp }}/release
      - name: Publish the tested artifact using npm trusted publishing
        run: node scripts/release.mjs publish "$RELEASE_TARGET" "$RUNNER_TEMP/release" "$RELEASE_VERSION" "$GITHUB_SHA"
      - name: Verify npm signatures, provenance, source commit, and artifact integrity
        run: node scripts/release.mjs verify "$RELEASE_TARGET" "$RUNNER_TEMP/release" "$RELEASE_VERSION" "$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-publication-evidence
          path: ${{ runner.temp }}/release/verified-publication.json
          if-no-files-found: error
          retention-days: 90
